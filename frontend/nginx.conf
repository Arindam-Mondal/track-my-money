# Serves the built app, and forwards the API to the backend container (docker-compose.yml).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Statement uploads: the backend allows MAX_UPLOAD_MB (20 MB by default).
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Parsing a statement and asking Jev about its columns can take a while.
        proxy_read_timeout 300s;
    }

    # The API documentation (http://127.0.0.1:8080/docs).
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
    }

    # Built files have a content hash in their name, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
