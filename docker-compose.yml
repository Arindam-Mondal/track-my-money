# track-my-money in Docker. Start everything with: docker compose up -d   -> http://127.0.0.1:8080
#   frontend - the React app (nginx) on 127.0.0.1:8080; forwards /api to the backend
#   backend  - FastAPI; runs the database migrations on start. Reads backend/.env if it exists
#              (JEV_API_KEY, MASKING_SECRET, LAYA_MODEL).
#   db       - Postgres on 127.0.0.1:5433 (a local Postgres may already be using 5432)
#   laya     - optional (--profile laya): our fine-tuned Laya model, Jev-compatible API on 127.0.0.1:8100.
#              Needs the checkpoint in models/laya-finance first: see backend/training/README.md.
# For development, run only the database (docker compose up -d db) and the backend and frontend on the host.
services:
  frontend:
    build: ./frontend
    image: track-my-money-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    image: track-my-money-backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # These replace the host values in backend/.env: inside Docker, services are reached by name.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-trackmymoney}:${POSTGRES_PASSWORD:-trackmymoney}@db:5432/${POSTGRES_DB:-trackmymoney}
      LAYA_BASE_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-local-laya-key}
      # Used only when backend/.env has no MASKING_SECRET: the key is created once and kept on a volume.
      MASKING_SECRET_FILE: /app/state/masking_secret
    volumes:
      - backend-state:/app/state
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackmymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackmymoney}
      POSTGRES_DB: ${POSTGRES_DB:-trackmymoney}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Categorises transactions locally. Built from Laya's own Dockerfile at a pinned release; serves
  # our fine-tuned checkpoint (models/laya-finance). To compare with the base model, start it with
  # LAYA_MODELS=english,laya-finance (the base weights then download on first start).
  laya:
    profiles: ["laya"] # opt-in: docker compose --profile laya up -d
    build:
      context: https://github.com/NandhaKishorM/laya.git#v0.4.11
    image: track-my-money-laya:0.4.11
    command: ["laya-serve"]
    environment:
      LAYA_API_KEY: ${LAYA_API_KEY:-local-laya-key}
      LAYA_EXTRA_MODELS: '{"laya-finance": "/models/laya-finance"}'
      LAYA_MODELS: ${LAYA_MODELS:-laya-finance}
      LAYA_PRELOAD: "1" # load the checkpoints at start, not on the first request
      LAYA_JEV_STRICT: "1" # answer in the exact Jev wire format the TypeSafe SDK expects
      LAYA_THREADS: "4"
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./models:/models:ro
      - laya-cache:/home/laya/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10m

volumes:
  pgdata:
  laya-cache:
  backend-state:
