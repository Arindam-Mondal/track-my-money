# Local Postgres for track-my-money. Start with: docker compose up -d
# Port 5433 on the host, because a local Postgres may already be using 5432.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trackmymoney}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackmymoney}
      POSTGRES_DB: ${POSTGRES_DB:-trackmymoney}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
